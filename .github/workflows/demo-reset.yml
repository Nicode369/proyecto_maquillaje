name: Reiniciar demo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar secreto
        id: check
        run: |
          if [ -z "$DEMO_RESET_DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secreto DEMO_RESET_DATABASE_URL; se omite el reset automático."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DEMO_RESET_DATABASE_URL: ${{ secrets.DEMO_RESET_DATABASE_URL }}

      - name: Aplicar esquema y restaurar demo
        if: steps.check.outputs.skip != 'true'
        run: node scripts/demo-reset.mjs --confirm
        env:
          DEMO_RESET_DATABASE_URL: ${{ secrets.DEMO_RESET_DATABASE_URL }}
